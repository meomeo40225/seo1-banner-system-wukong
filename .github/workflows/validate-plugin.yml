name: Validate WordPress plugin

on:
  push:
    paths:
      - "plugin/**"
      - "config/**"
      - "media/**"
      - "scripts/validate_plugin.py"
      - "scripts/validate_media.py"
      - "scripts/test_rotation_core.js"
      - "scripts/test_sync_policy.php"
      - "scripts/test_swr_policy.php"
      - ".github/workflows/validate-plugin.yml"
  pull_request:
    paths:
      - "plugin/**"
      - "config/**"
      - "media/**"
      - "scripts/validate_plugin.py"
      - "scripts/validate_media.py"
      - "scripts/test_rotation_core.js"
      - "scripts/test_sync_policy.php"
      - "scripts/test_swr_policy.php"
      - ".github/workflows/validate-plugin.yml"

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: PHP syntax
        run: find plugin/thmt-banner-system -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: |
          node --check plugin/thmt-banner-system/assets/js/rotation-core.js
          node --check plugin/thmt-banner-system/assets/js/frontend.js

      - name: Rotation engine behavior
        run: node scripts/test_rotation_core.js

      - name: GitHub sync/cache policy
        run: php scripts/test_sync_policy.php

      - name: Stale-while-revalidate policy
        run: php scripts/test_swr_policy.php

      - name: Optimized media contract
        run: python scripts/validate_media.py

      - name: Performance engine contract
        run: python scripts/validate_plugin.py
