name: Deploy Banner Delivery to R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: banner-r2-delivery
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: missing required secret for $name"
              exit 1
            fi
          done

      - name: Verify AWS CLI
        run: aws --version

      - name: Upload central config
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp config/banners.json "s3://${R2_BUCKET}/config/banners.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=60, must-revalidate"

      - name: Sync optimized media
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync media/ "s3://${R2_BUCKET}/media/" \
            --endpoint-url "$ENDPOINT" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync GIF fallback assets
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync assets/ "s3://${R2_BUCKET}/assets/" \
            --endpoint-url "$ENDPOINT" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Verify uploaded config exists
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "config/banners.json" \
            --endpoint-url "$ENDPOINT" >/dev/null
          echo "R2 delivery upload verified."
