name: Validate banner config

on:
  push:
    paths:
      - "config/**"
      - "scripts/validate_config.py"
  pull_request:
    paths:
      - "config/**"
      - "scripts/validate_config.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - run: python scripts/validate_config.py
